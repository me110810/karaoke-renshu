<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>君をのせて れんしゅうカラオケ</title>
<style>
:root{--bg:#f1f4f1;--surface:#fff;--ink:#1b232b;--muted:#5b6670;--line:#d6ddd7;--accent:#2c6a52;--accent-ink:#fff;--bad:#c2452f}
@media (prefers-color-scheme: dark){:root{--bg:#11171a;--surface:#192125;--ink:#e6ece8;--muted:#97a39e;--line:#2b363a;--accent:#6cc19c;--accent-ink:#0d1a14;--bad:#f07a62;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);
  font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  padding:24px max(16px,env(safe-area-inset-right)) 24px max(16px,env(safe-area-inset-left))}
form{width:min(380px,100%);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px 24px;display:grid;gap:14px}
h1{margin:0;font-size:1.5rem;line-height:1.3}
p{margin:0;color:var(--muted);font-size:.92rem;line-height:1.6}
input[type=password],input[type=text]{width:100%;font:inherit;font-size:1.2rem;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);letter-spacing:.05em}
input:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
label{display:flex;gap:8px;align-items:center;font-size:.9rem;color:var(--muted)}
label input{width:18px;height:18px;accent-color:var(--accent)}
button{font:inherit;font-weight:700;font-size:1.05rem;min-height:50px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
button:disabled{opacity:.6}
#msg{min-height:1.5em;color:var(--bad);font-size:.9rem}
#msg.info{color:var(--muted)}
</style>
</head>
<body>
<form id="f">
  <h1>君をのせて<br><span style="font-size:.7em;color:var(--muted)">れんしゅうカラオケ</span></h1>
  <p>先生から聞いたパスワードを入れてください。</p>
  <input type="password" id="pw" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="パスワード" required>
  <label><input type="checkbox" id="show"> パスワードを表示</label>
  <label><input type="checkbox" id="remember" checked> この端末で覚えておく</label>
  <button id="go">ひらく</button>
  <div id="msg" role="status"></div>
</form>
<script>
(function(){
const KEY="kns-pw";
const $=s=>document.getElementById(s);
const msg=(t,info)=>{$("msg").textContent=t;$("msg").className=info?"info":"";};
$("show").onchange=e=>{$("pw").type=e.target.checked?"text":"password";};
let bin=null;
async function getBin(){if(bin)return bin;const r=await fetch("app.bin",{cache:"no-cache"});if(!r.ok)throw new Error("fetch");bin=new Uint8Array(await r.arrayBuffer());return bin;}
async function open(pw){
  if(!window.crypto||!crypto.subtle){msg("このブラウザでは開けません。iPadはSafari、PCはChromeで開いてください。");return false;}
  msg("読み込み中…（はじめは少し時間がかかります）",true);$("go").disabled=true;
  try{
    const b=await getBin();
    if(String.fromCharCode(...b.slice(0,4))!=="KNS1")throw new Error("format");
    const salt=b.slice(4,20),iv=b.slice(20,32),ct=b.slice(32);
    const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
    const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:300000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
    let plain;
    try{plain=await crypto.subtle.decrypt({name:"AES-GCM",iv},key,ct);}
    catch(e){msg("パスワードがちがいます。");$("go").disabled=false;try{localStorage.removeItem(KEY);}catch(_){}return false;}
    try{sessionStorage.setItem("kns-pw-session",pw);}catch(_){}
    try{if($("remember").checked)localStorage.setItem(KEY,pw);else localStorage.removeItem(KEY);}catch(_){}
    const html=new TextDecoder().decode(plain);
    document.open();document.write(html);document.close();
    return true;
  }catch(e){msg("読み込めませんでした。通信状況を確かめて、ページを読み込み直してください。");$("go").disabled=false;return false;}
}
$("f").addEventListener("submit",e=>{e.preventDefault();const pw=$("pw").value.trim();if(pw)open(pw);});
let saved=null;try{saved=localStorage.getItem(KEY);}catch(_){}
if(saved){$("pw").value=saved;open(saved);}
})();
</script>
</body>
</html>
